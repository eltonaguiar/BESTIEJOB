name: Daily LinkedIn sweep

# Pulls fresh ServiceNow / Salesforce / ITSM postings from LinkedIn's public
# guest search endpoint, writes an inbox submission, merges it into README.md
# and rebuilds the Pages data. Single daily run, never on push, so it cannot
# queue up behind itself.

on:
  schedule:
    - cron: '20 11 * * *'   # 11:20 UTC = 06:20 America/Toronto
  workflow_dispatch:

permissions:
  contents: write

# Serialised with every other workflow that pushes to main (hourly-scan,
# fresh-ca-scan, gap-channels): two pushers at once rebase-collide on the
# generated jobs.json/public files and strand the loser's work.
concurrency:
  group: bestiejob-main-write
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Sweep LinkedIn and merge
        # Cap must exceed the live per-family row count or the scan's own render
        # archives in-window postings (see the rebase step below).
        run: python3 scripts/linkedin_guest_scan.py --days 3 --apply --max-per-table 5000

      - name: Reject unparseable jobs.json before it can reach main
        run: python3 -c "import json;json.load(open('jobs.json'));print('jobs.json parses')"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "bestiejob-sweep"
          git config user.email "bestiejob-sweep@users.noreply.github.com"
          git add -A README.md README.BAK_*.md inbox public raw 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new postings today"
            exit 0
          fi
          git commit -m "chore(scan): daily LinkedIn sweep $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4; do
            git fetch -q origin main
            git rebase -q origin/main || {
              git checkout origin/main -- README.md
              # The board holds more than 400 rows per family inside the 30-day
              # window (2026-11-09: 757 ServiceNow / 794 Salesforce / 2,945
              # other). A 400 cap silently archives live postings into
              # README.BAK_*.md, so the cap must stay well above the real count.
              python3 tools/jobs_merge_inbox.py --max-per-table 5000 --bump-inbox
              python3 tools/build_site.py
              git add README.md public inbox tools
              GIT_EDITOR=true git rebase --continue
            }
            if git push -q origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not push after retries"
          exit 1
