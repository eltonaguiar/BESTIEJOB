name: Hourly Job Scan

on:
  schedule:
    # Every hour at :00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (LinkedIn fallback)
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Run hourly job scan
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          NODE_ENV: production
        run: node scripts/daily_job_scan.mjs --no-readme

      - name: Gap scan (partner career sites + keyword variants)
        continue-on-error: true
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
        run: node scripts/gap_scan.mjs

      # Public-sector boards the rest of the pipeline cannot see: City of Toronto
      # (SuccessFactors tiles + schema.org datePosted) and Ontario Public Service
      # (gojobs is bot-walled, so the Job Bank OPS employer feed is the documented
      # fallback). Usually contributes few rows — public-sector IT postings are
      # rare and internal-only competitions are invisible — but it is the only
      # channel that surfaces them at all.
      - name: Public-sector scan (OPS + City of Toronto)
        continue-on-error: true
        run: python3 scripts/public_sector_scan.py

      # A row whose Posted cell is not an absolute YYYY-MM-DD is dropped by the
      # merger without an error, so fail here first.
      - name: Validate inbox submissions
        run: python3 scripts/check_inbox.py

      # Nothing in CI used to merge inbox/ — peer and gap-scan submissions only
      # reached README.md when someone ran the merger by hand. The 150/family
      # default also archived ~15 rows per table, so they never showed up.
      - name: Merge inbox submissions into README
        run: |
          if [ -n "$(git status --porcelain -- inbox)" ]; then
            python3 tools/jobs_merge_inbox.py --max-per-table 400 --bump-inbox
          else
            echo "no new inbox submissions"
          fi

      - name: Sync curated README rows into the feed
        run: node scripts/sync_readme_to_jobs.mjs

      - name: Rebuild page data from README
        run: python3 tools/build_site.py

      - name: Commit refreshed job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add jobs.json public/jobs.json public/gotjob/jobs.json public/findjobs/jobs.json public/jobs-data.json public/index.html FRESH_JOBS.md README.md inbox

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          JOB_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('jobs.json','utf8')).jobs.length)")
          git commit -m "chore(jobs): hourly scan refresh (${JOB_COUNT} listings, $(date -u +%Y-%m-%dT%H:%M:%SZ)) [skip ci]"
          # Peer agents push to main constantly, so a bare `git push` is rejected
          # with "fetch first" and the whole run fails with the work stranded
          # locally (run 41543335815, 2026-11-02). Rebase once and retry.
          git push || {
            echo "push rejected — rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main
            git push
          }
