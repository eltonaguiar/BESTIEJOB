name: Scrape Jobs

on:
  workflow_dispatch:
    inputs:
      playwright:
        description: "Enable Playwright fallback for LinkedIn"
        required: false
        default: false
        type: boolean
  schedule:
    # Daily at 11:20 UTC (07:20 ET) — the scanner replaces the old 30-minute loop,
    # which queued runs faster than they could finish and rarely changed the data.
    - cron: "20 11 * * *"
  push:
    branches:
      - main
    paths:
      - 'scrapers/**'
      - 'scripts/daily_job_scan.mjs'

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: github.event_name == 'schedule' || inputs.playwright
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Run daily job scan
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          NODE_ENV: production
        run: |
          if [ "${{ inputs.playwright }}" = "true" ]; then
            node scripts/daily_job_scan.mjs --playwright
          else
            node scripts/daily_job_scan.mjs
          fi

      - name: Commit refreshed job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add jobs.json public/jobs.json public/gotjob/jobs.json public/findjobs/jobs.json FRESH_JOBS.md README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          JOB_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('jobs.json','utf8')).jobs.length)")
          git commit -m "chore(jobs): daily scan refresh (${JOB_COUNT} listings, $(date -u +%Y-%m-%d))"
          git push

      - name: Deploy to FTP (optional)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASS" ]; then
            node scripts/upload-gotjob.js
          else
            echo "FTP credentials not configured, skipping deployment"
          fi
        continue-on-error: true
