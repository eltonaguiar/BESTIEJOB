# Local pytest config so `scripts.*` imports resolve when running from bestiejob/.
# Without this, pytest walks up to the monorepo root pytest.ini and sets
# rootdir/pythonpath to the monorepo root, breaking `from scripts.referral import ...`.
[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
addopts = -ra
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration / network tests
    network: marks tests that hit live network endpoints (deselect with '-m "not network"')
